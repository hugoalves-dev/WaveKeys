[package]
name = "wavekeys"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui_extras = { version = "0.31", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
wavekeys-core = { path = "../core" }

[build-dependencies]
resvg = "0.37"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
